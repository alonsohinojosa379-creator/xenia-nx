name: Switch - export toolchain

# Packs the devkitA64 + libnx toolchain into an orphan "toolchain" branch so it
# can be fetched with plain git (used for fast local iteration).
on:
  push:
    branches: [switch]
    paths: ['.github/workflows/switch-toolchain-export.yml']

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Install extra portlibs
        run: |
          dkp-pacman -Syu --noconfirm || true
          dkp-pacman -S --noconfirm --needed switch-sdl2 switch-mesa switch-libdrm_nouveau switch-zlib switch-zstd || true
          (command -v git && command -v zstd) || (apt-get update && apt-get install -y git zstd)
      - name: Pack and push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir /pack && cd /pack
          tar -C /opt -cf - devkitpro | zstd -19 -T0 | split -b 90M - devkitpro.tar.zst.
          ls -la
          git init -q -b toolchain
          git config user.name "toolchain-bot"
          git config user.email "toolchain-bot@users.noreply.github.com"
          git add . && git commit -qm "devkitA64 toolchain snapshot"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" toolchain
